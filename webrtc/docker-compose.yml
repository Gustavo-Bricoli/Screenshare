services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml --bind 0.0.0.0
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "17880:7880"
      - "17881:17881"
      - "17882:17882/udp"
    restart: unless-stopped


  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "server"]
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:17880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      PORT: 8787
    ports:
      - "8787:8787"
    depends_on:
      - livekit
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      API_PROXY_TARGET: http://api:8787
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  publisher:
    build:
      context: .
      dockerfile: Dockerfile.publisher
    environment:
      LIVEKIT_TOKEN_URL: http://api:8787/api/token
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:17880}
      LIVEKIT_ROOM: ${LIVEKIT_ROOM:-screen-share}
      LIVEKIT_IDENTITY: ${LIVEKIT_IDENTITY:-python-sender}
    depends_on:
      api:
        condition: service_healthy
      livekit:
        condition: service_started
    profiles:
      - python-publisher
    restart: unless-stopped